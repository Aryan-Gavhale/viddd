<link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&family=Lilita+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Puppies+Play&family=Qwitcher+Grypen:wght@400;700&family=Righteous&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vidlancing — Video Freelancing Marketplace</title>
    <script>
      // Pre-hydration paint: apply persisted appearance to <html> before
      // React boots so users on dark mode never see a white-flash of
      // unstyled content on first paint.
      (function () {
        try {
          var raw = localStorage.getItem("appearance");
          var pref = raw ? JSON.parse(raw) : null;
          var html = document.documentElement;
          var theme = (pref && pref.theme) || "system";
          var dark = theme === "dark" || (theme === "system" && window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) html.classList.add("dark");
          html.setAttribute("data-accent", (pref && pref.accentColor) || "violet");
          var sizes = { small: "14px", medium: "16px", large: "18px" };
          html.style.fontSize = sizes[(pref && pref.fontSize) || "medium"] || "16px";
          var lang = (pref && pref.language) || localStorage.getItem("language") || "en";
          html.setAttribute("lang", lang);
        } catch (_) { /* localStorage blocked / parse failure — defaults stand */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
